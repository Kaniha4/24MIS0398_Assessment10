
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
        - name: ewaste-portal
          image: kaniha4/ewaste-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-service
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
